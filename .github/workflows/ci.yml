name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same version as homelab-ai-platform. Runs first: nothing else matters
      # if a secret or a piece of home network topology is in the tree.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks detect --no-git --config .gitleaks.toml --redact

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
